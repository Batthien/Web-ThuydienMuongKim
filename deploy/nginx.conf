# /etc/nginx/sites-available/muongkim
# Thay thuydienmuongkim.vn bằng tên miền thật. Sau khi bật, chạy certbot để thêm HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name thuydienmuongkim.vn www.thuydienmuongkim.vn;

    # Tải tài liệu cổ đông & CV tối đa 50 MB
    client_max_body_size 55m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    # Ảnh đã tối ưu — Nginx phục vụ trực tiếp, cache dài
    location /media/ {
        alias /var/www/muongkim-web/public/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
